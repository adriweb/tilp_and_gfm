name: Build Windows

on:
  push:
    branches: [ master, gtk3, fullvcpkg ]
  pull_request:
    branches: [ master, gtk3, fullvcpkg ]
  release:
    types: [published]

jobs:
  build:
    name: "Build: ${{ matrix.arch }} ${{ matrix.os }} - ${{ matrix.gtkver }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        gtkver: [GTK3]
        arch: [x86,x64]
        config: [Release]

    env:
      SCCACHE_GHA_ENABLED: "true"
      # Override run-vcpkg's default, which still selects the removed x-gha backend.
      VCPKG_BINARY_SOURCES: clear;default,readwrite
      # Match run-vcpkg's normalized Windows spelling: cache versions hash this path.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      # vcpkg sanitizes the Windows environment before configuring ports.
      VCPKG_KEEP_ENV_VARS: CMAKE_C_COMPILER_LAUNCHER;CMAKE_CXX_COMPILER_LAUNCHER;SCCACHE_GHA_ENABLED;ACTIONS_RESULTS_URL;ACTIONS_RUNTIME_TOKEN;ACTIONS_CACHE_SERVICE_V2

    steps:
      - name: Remove Perl Strawberry installation
        # Removes conflicting headers from include paths
        run: |
          Remove-Item -Recurse -Force C:/Strawberry

      - name: Checkout Git Repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Resolve pushed tilibs experimental2 tip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/update-tilibs-port.py

      - name: Install latest CMake
        uses: lukka/get-cmake@16e8153a8b4918849d92aad131befe67a3705daa # latest as of 2026-11-15

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # latest as of 2026-11-15
        with:
          version: v0.19.0

      - name: Configure compiler cache
        shell: bash
        run: |
          # CMake reads these for both the application and CMake-based vcpkg ports.
          echo "CMAKE_C_COMPILER_LAUNCHER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --start-server
          mkdir -p .vcpkg-binary-cache

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', '.cmake/**') }}-${{ matrix.gtkver }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', '.cmake/**') }}-
            vcpkg-v1-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Restore artifacts, or setup vcpkg (do not install any package)
        uses: lukka/run-vcpkg@d4e6061274d7ffb3e33694898aed9fb6ece66310 # latest as of 2026-11-15
        with:
          vcpkgDirectory: C:/vcpkg
          binaryCachePath: ${{ github.workspace }}/.vcpkg-binary-cache

      - name: create install folder
        run: |
          mkdir "${{ github.workspace }}/tilp.build/Win-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix"

      - name: Build and install tilp (${{ matrix.gtkver }}) and gfm ${{ matrix.config }} on Windows ${{ matrix.arch }}
        uses: lukka/run-cmake@338027a0ca347414b3abaa50a883bdc2b91d1812 # latest as of 2026-11-15
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: 'Win-${{ matrix.arch }}-${{ matrix.gtkver }}'
          configurePresetAdditionalArgs: "['-DDEPS_RELEASE_ONLY=ON']"
          buildPreset: 'Win-${{ matrix.arch }}-${{ matrix.gtkver }}-${{ matrix.config }}'
          buildPresetAdditionalArgs: "['--target', 'install']"
        env:
          CMAKE_INSTALL_PREFIX_OVERRIDE: ${{ github.workspace }}/tilp.build/Win-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static-release
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Verify static MSVC runtime linkage
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          $executables = @(Get-ChildItem '${{ github.workspace }}/tilp.build/Win-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix/bin/*.exe')
          if ($executables.Count -eq 0) { throw 'No installed executables found' }
          foreach ($exe in $executables) {
            $imports = & $dumpbin /DEPENDENTS $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $($exe.Name)" }
            $imports
            if ($imports -match '(?i)\b(vcruntime[\w]*|msvcp[\w]*|msvcr[\w]*|ucrtbase[d]?|api-ms-win-crt-[\w-]+)\.dll\b') {
              throw "$($exe.Name) imports a dynamic MSVC/UCRT runtime"
            }
          }

      - name: Upload install folder
        uses: actions/upload-artifact@v7
        with:
          name: tilp_${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.gtkver }}
          path: ${{ github.workspace }}/tilp.build/Win-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix

      # Keep successfully built dependencies even when a later build step fails.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
