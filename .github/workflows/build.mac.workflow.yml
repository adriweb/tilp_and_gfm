name: Build macOS

on:
  push:
    branches: [ master, gtk3, fullvcpkg ]
  pull_request:
    branches: [ master, gtk3, fullvcpkg ]
  release:
    types: [published]

jobs:
  build:
    name: "Build: ${{ matrix.arch }} ${{ matrix.os }} - ${{ matrix.gtkver }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
        gtkver: [GTK2, GTK3]
        config: [Release]
        include:
          - os: macos-12
            arch: x64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          brew install automake autoconf libtool gtk+ intltool python-setuptools
          pip install -U setuptools

      - name: Generate tilp+gfm i18n resources
        run: |
          cd  gfm/trunk/po; intltool-update --pot; intltool-update fr; cd ../../..
          cd tilp/trunk/po; intltool-update --pot; intltool-update fr; intltool-update de; cd ../../..

      - name: Install latest CMake
        uses: lukka/get-cmake@a70f1cfa1857a3eecfe0d34962269e1b1e8be56c # latest as of 2024-08-08

      - name: Restore artifacts, or setup vcpkg (do not install any package)
        uses: lukka/run-vcpkg@d87e7fac99f22776a4973d7e413921ea254c1fc9 # latest as of 2024-08-08

      - name: create install folder
        run: |
          mkdir -p "${{ github.workspace }}/tilp.build/Mac-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix"

      - name: Build and install tilp (${{ matrix.gtkver }}) and gfm ${{ matrix.config }} on Mac ${{ matrix.arch }}
        uses: lukka/run-cmake@4b1adc1944be8367be9f4e08303ce49918db8e3c # latest as of 2024-08-08
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: 'Mac-${{ matrix.arch }}-${{ matrix.gtkver }}'
          configurePresetAdditionalArgs: "['-DDEPS_RELEASE_ONLY=ON']"
          buildPreset: 'Mac-${{ matrix.arch }}-${{ matrix.gtkver }}-${{ matrix.config }}'
          buildPresetAdditionalArgs: "['--target', 'install']"
        env:
          CMAKE_INSTALL_PREFIX_OVERRIDE: ${{ github.workspace }}/tilp.build/Mac-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.arch }}-osx-release
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Upload install folder
        uses: actions/upload-artifact@v4
        with:
          name: tilp_${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.gtkver }}
          path: ${{ github.workspace }}/tilp.build/Mac-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix
