name: Build Linux

on:
  push:
    branches: [ master, gtk3, fullvcpkg ]
  pull_request:
    branches: [ master, gtk3, fullvcpkg ]
  release:
    types: [published]

jobs:
  build:
    name: "Build: ${{ matrix.arch }} ${{ matrix.os }} - ${{ matrix.gtkver }} - ${{ matrix.upload_suffix }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        arch: [x64]
        config: [Release]
        gtkver: [GTK2, GTK3]
        statictype: [ON, OFF]
        include:
          - statictype: ON
            preset_suffix: ""
            upload_suffix: static
          - statictype: OFF
            preset_suffix: "-Dynamic"
            upload_suffix: shared

    env:
      SCCACHE_GHA_ENABLED: "true"
      # Override run-vcpkg's default, which still selects the removed x-gha backend.
      VCPKG_BINARY_SOURCES: clear;default,readwrite
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      # vcpkg sanitizes the Windows environment before configuring ports.
      VCPKG_KEEP_ENV_VARS: CMAKE_C_COMPILER_LAUNCHER;CMAKE_CXX_COMPILER_LAUNCHER;SCCACHE_GHA_ENABLED;ACTIONS_RESULTS_URL;ACTIONS_RUNTIME_TOKEN;ACTIONS_CACHE_SERVICE_V2

    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Resolve pushed tilibs experimental2 tip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update-tilibs-port.py

      - name: Install dependencies
        run: |
          set -e
          sudo apt install -y libgtk2.0-dev libgtk-3-dev libudev-dev autoconf autoconf-archive automake libtool libltdl-dev patchelf pkg-config libxi-dev libxtst-dev libx11-dev libgles2-mesa-dev intltool

      - name: Generate tilp+gfm i18n resources
        run: |
          cd  gfm/trunk/po; intltool-update --pot; intltool-update fr; cd ../../..
          cd tilp/trunk/po; intltool-update --pot; intltool-update fr; intltool-update de; cd ../../..

      - name: workaround for default apt mirror connectivity issues
        run: |
          sudo sed -i 's/azure\.//' /etc/apt/sources.list

      - name: Install latest CMake
        uses: lukka/get-cmake@16e8153a8b4918849d92aad131befe67a3705daa # latest as of 2026-11-15

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # latest as of 2026-11-15
        with:
          version: v0.19.0

      - name: Configure compiler cache
        shell: bash
        run: |
          # CMake reads these for both the application and CMake-based vcpkg ports.
          echo "CMAKE_C_COMPILER_LAUNCHER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --start-server
          mkdir -p .vcpkg-binary-cache

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.upload_suffix }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', '.cmake/**') }}-${{ matrix.gtkver }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.upload_suffix }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', '.cmake/**') }}-
            vcpkg-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.upload_suffix }}-

      - name: Restore artifacts, or setup vcpkg (do not install any package)
        uses: lukka/run-vcpkg@d4e6061274d7ffb3e33694898aed9fb6ece66310 # latest as of 2026-11-15
        with:
          binaryCachePath: ${{ github.workspace }}/.vcpkg-binary-cache

      - name: create install folder
        run: |
          mkdir -p "${{ github.workspace }}/tilp.build/Linux-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix"

      - name: Build and install tilp (${{ matrix.gtkver }}) and gfm ${{ matrix.config }} on Linux ${{ matrix.arch }}
        uses: lukka/run-cmake@338027a0ca347414b3abaa50a883bdc2b91d1812 # latest as of 2026-11-15
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: 'Linux-${{ matrix.arch }}-${{ matrix.gtkver }}${{ matrix.preset_suffix }}'
          configurePresetAdditionalArgs: "['-DDEPS_RELEASE_ONLY=ON']"
          buildPreset: 'Linux-${{ matrix.arch }}-${{ matrix.gtkver }}${{ matrix.preset_suffix }}-${{ matrix.config }}'
          buildPresetAdditionalArgs: "['--target', 'install']"
        env:
          CMAKE_INSTALL_PREFIX_OVERRIDE: ${{ github.workspace }}/tilp.build/Linux-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.arch }}-linux-release
          VCPKG_FORCE_SYSTEM_BINARIES: 1

      - name: Check relocated shared install
        if: matrix.upload_suffix == 'shared'
        shell: bash
        run: |
          relocated="$(mktemp -d "${RUNNER_TEMP}/tilp-relocated.XXXXXX")"
          cp -a "${{ github.workspace }}/tilp.build/Linux-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix/." "$relocated/"
          ldd "$relocated/bin/tilp" | tee "${RUNNER_TEMP}/tilp-runtime-libraries.txt"
          if grep -E 'not found|/vcpkg_installed/' "${RUNNER_TEMP}/tilp-runtime-libraries.txt"; then
            exit 1
          fi
          "$relocated/bin/tilp" --version

      - name: Upload install folder
        uses: actions/upload-artifact@v7
        with:
          name: tilp_and_gfm_${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.gtkver }}_${{ matrix.upload_suffix }}Deps
          path: ${{ github.workspace }}/tilp.build/Linux-${{ matrix.arch }}-${{ matrix.gtkver }}/prefix

      # Keep successfully built dependencies even when a later build step fails.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
